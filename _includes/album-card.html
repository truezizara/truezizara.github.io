{% assign cover = include.album.photos | first %}
<a class="album" href="{{ include.album.url | relative_url }}">
  <div class="album-cover">{% if cover %}<img src="{{ cover | relative_url }}" alt="" loading="lazy">{% else %}пока пусто{% endif %}</div>
  <div class="album-name">{{ include.album.title }}</div>
  <div class="album-meta">{% if include.album.type == 'film' %}плёнка{% else %}iPhone 12 Pro{% endif %} · {{ include.album.date | date: "%Y" }}</div>
</a>
